<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

/* ---------- settings ---------- */
const THEMES = ['snow', 'graphite', 'tangerine', 'mint'];

/* ---------- tag parsing ---------- */
function decodeText(bytes, enc) {

}
const parseTags = buf => { try { return parseID3(buf) || parseMP4(buf) || {}; } catch (e) { return {}; } };
function metaFromPath(rel) {

/* ---------- library ---------- */
const lib = { dropbox: [], local: [] };

  for (const v of stack) if (v.type === 'list') v.items = v.gen();

}

/* ---------- menus ---------- */
const stack = [];

const emptyItems = () => [{ label: 'No songs yet', chev: 1, go: () => pushList('Add Songs', addItems) }];

function mainItems() {
  const it = [
    { label: 'Music', chev: 1, go: () => pushList('Music', musicItems) },
    { label: 'Shuffle Songs', go: shuffleAll },
    { label: 'Add Songs', chev: 1, go: () => pushList('Add Songs', addItems) },
    { label: 'Settings', chev: 1, go: () => pushList('Settings', settingsItems) },
  ];
  if (queue.length) it.push({ label: 'Now Playing', chev: 1, go: pushNow });
  return it;
}
function musicItems() {
  return [
    { label: 'Artists', chev: 1, go: () => pushList('Artists', artistItems) },
    { label: 'Albums', chev: 1, go: () => pushList('Albums', () => albumItems(all)) },
    { label: 'Songs', chev: 1, go: () => pushList('Songs', () => songItems(all)) },
  ];
}
function artistItems() {
  if (!all.length) return emptyItems();
  const names = [...new Set(all.map(groupArtist))].sort((a, b) => sortKey(a).localeCompare(sortKey(b)));

  if (!r.ok) throw new Error('download ' + r.status);
  const reader = r.body.getReader(), chunks = []; let total = 0;
  while (total < bytes) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); total += value.length; }
  try { reader.cancel(); } catch (e) {}
  const out = new Uint8Array(Math.min(total, bytes)); let o = 0;
  for (const c of chunks) { const n = Math.min(c.length, out.length - o); out.set(c.subarray(0, n), o); o += n; if (o >= out.length) break; }
  return out.buffer;
}
let scanningList = false;
async function scanDropbox() {
  if (scanningList) return; scanningList = true;
  try {
    status('Listing Dropbox…');
    const root = rootNorm(), files = [];
    const add = es => es.forEach(e => { if (e['.tag'] === 'file' && AUDIO_EXT.test(e.name)) files.push(e); });
    let res = await dbxRpc('files/list_folder', { path: root, recursive: true, limit: 2000 });
    add(res.entries);
    while (res.has_more) { status(`Listing Dropbox… ${files.length}`); res = await dbxRpc('files/list_folder/continue', { cursor: res.cursor }); add(res.entries); }
    const old = new Map(lib.dropbox.map(t => [t.id, t]));
    lib.dropbox = files.map(e => {
      const id = 'dbx:' + e.id, prev = old.get(id);
      if (prev && prev.rev === e.rev) return Object.assign(prev, { path: e.path_lower });
      return { id, src: 'dropbox', path: e.path_lower, rev: e.rev, name: e.name, ...metaFromPath(e.path_display.slice(root.length)), tagged: false };
    });
    LS.set('dbxLastScan', Date.now());
    await saveLib('dropbox'); rebuild(); status('');
    toast(`${files.length} songs in Dropbox`);
  } finally { scanningList = false; status(''); }
  if (settings.readTags) tagScan();
}
let tagging = false;
async function tagScan() {
  if (tagging) return; tagging = true;
  const todo = lib.dropbox.filter(t => !t.tagged), total = todo.length; let done = 0;
  const worker = async () => {
    while (todo.length && settings.readTags) {
      const t = todo.shift();
      try { applyTags(t, parseTags(await dbxHead(t.path, 131072))); t.tagged = true; } catch (e) {}
      done++;
      if (done % 15 === 0) { status(`Reading tags ${done}/${total}`); rebuild(); saveLib('dropbox'); }
    }
  };
  if (total) status(`Reading tags 0/${total}`);
  await Promise.all([worker(), worker(), worker(), worker()]);
  tagging = false; status(''); await saveLib('dropbox'); rebuild();
}
async function disconnectDropbox() {
  LS.del('dbxRefresh'); tok = null;
  const ids = new Set(lib.dropbox.map(t => t.id));
  lib.dropbox = []; await saveLib('dropbox');
  if (queue.some(t => ids.has(t.id))) { audio.pause(); queue = queue.filter(t => !ids.has(t.id)); qi = Math.min(qi, queue.length - 1); loaded = false; }
  rebuild(); toast('Dropbox disconnected');
}

/* ---------- panels ---------- */
function openPanel(html, wire) { $('#card').innerHTML = html; $('#panel').hidden = false; wire && wire($('#card')); }
function closePanel() { $('#panel').hidden = true; }
$('#panel').addEventListener('click', e => { if (e.target.id === 'panel') closePanel(); });
function showDropboxSetup() {
  if (EMBEDDED) {
    openPanel(`<h2>Connect Dropbox</h2>
      <p>Streaming straight from Dropbox only works once Spinwheel is on its own web address. This preview window blocks connections to Dropbox.</p>
      <p><b>For now:</b> go back and choose <b>From Files App</b>. In the picker, tap <b>Browse</b>, open <b>Dropbox</b>, go into your music folder and select songs. (Your iPhone needs the Dropbox app installed.)</p>
      <div class="btns"><button class="primary" data-x>OK</button></div>`, c => c.querySelector('[data-x]').onclick = closePanel);
    return;
  }
  const redirect = dbxRedirect();
  openPanel(`<h2>Connect Dropbox</h2>
    <p class="small">One-time setup, about 3 minutes.</p>
    <ol>
      <li>Open <a href="https://www.dropbox.com/developers/apps/create" target="_blank" rel="noopener">dropbox.com/developers/apps</a> and create an app: <b>Scoped access</b>, then <b>Full Dropbox</b>. Give it any name.</li>
      <li>On the <b>Permissions</b> tab, tick <code>files.metadata.read</code> and <code>files.content.read</code>, then press <b>Submit</b>.</li>
      <li>On the <b>Settings</b> tab, add this under <b>Redirect URIs</b>:<br><code id="redir">${esc(redirect)}</code> <button data-copy style="padding:4px 10px;font-size:13px">Copy</button></li>
      <li>Copy the <b>App key</b> from the same tab and paste it below.</li>
    </ol>
    <label for="k">App key</label><input id="k" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(dbxKey())}">
    <label for="f">Music folder in Dropbox</label><input id="f" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="/Music" value="${esc(LS.get('dbxRoot', '/Music'))}">
    <p class="small">Folders laid out as Artist / Album / Song work best. Song tags are read too.</p>
    <div class="btns"><button data-x>Cancel</button><button class="primary" data-go>Connect</button></div>`, c => {
    c.querySelector('[data-x]').onclick = closePanel;
    c.querySelector('[data-copy]').onclick = async ev => { try { await navigator.clipboard.writeText(redirect); ev.target.textContent = 'Copied'; } catch (e) { ev.target.textContent = 'Select it'; } };
    c.querySelector('[data-go]').onclick = () => {
      const key = c.querySelector('#k').value.trim(), root = c.querySelector('#f').value.trim();
      if (!key) { c.querySelector('#k').focus(); return; }
      if (dbxConnected() && key === dbxKey()) { LS.set('dbxRoot', root); closePanel(); scanDropbox().catch(e => toast(e.message, 4000)); return; }
      startDropboxAuth(key, root);
    };
  });
}

      <li><b>Centre button</b> selects. <b>MENU</b> goes back.</li>

/* ---------- icon ---------- */
function makeIcon() {
  try {
    const cs = getComputedStyle(document.body), v = n => cs.getPropertyValue(n).trim();
    const draw = S => {
      const c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d');
      const grd = g.createLinearGradient(0, 0, S, S); grd.addColorStop(0, v('--body1')); grd.addColorStop(1, v('--body2'));
      g.fillStyle = grd; g.fillRect(0, 0, S, S);
      g.fillStyle = '#151515'; g.beginPath(); g.roundRect(S * .24, S * .1, S * .52, S * .38, S * .04); g.fill();
      g.fillStyle = v('--lcd'); g.beginPath(); g.roundRect(S * .26, S * .12, S * .48, S * .34, S * .025); g.fill();
      g.fillStyle = v('--ink'); for (let i = 0; i < 4; i++) g.fillRect(S * .3, S * (.17 + i * .07), S * (i === 1 ? .4 : .3), S * .035);
      g.fillStyle = v('--wheel'); g.beginPath(); g.arc(S / 2, S * .71, S * .22, 0, Math.PI * 2); g.fill();
      g.fillStyle = v('--center2'); g.beginPath(); g.arc(S / 2, S * .71, S * .08, 0, Math.PI * 2); g.fill();
      return c.toDataURL('image/png');
    };
    $('#touchIcon').href = draw(180); iconUrl = draw(512);
  } catch (e) {}
}

/* ---------- start ---------- */
(async () => {
  applyTheme();
  lib.dropbox = (await kvGet('lib-dropbox')) || [];
  lib.local = ((await kvGet('lib-local')) || []).filter(t => !t.temp);
  rebuildIndex();
  stack.push({ type: 'list', title: 'Spinwheel', gen: mainItems, items: mainItems(), sel: 0, top: 0 });
  layout(); render();
  if (document.fonts) document.fonts.ready.then(() => { layout(); render(); });
  try {
    if (await handleAuthRedirect()) { toast('Dropbox connected'); await scanDropbox(); }
    else if (dbxConnected() && Date.now() - LS.get('dbxLastScan', 0) > 6 * 3600e3) scanDropbox().catch(() => {});
    else if (dbxConnected() && settings.readTags && lib.dropbox.some(t => !t.tagged)) tagScan();
  } catch (e) { toast(e.message, 4500); }
  if (!all.length && !dbxConnected()) setTimeout(() => toast('Welcome! Pick Add Songs to load music.', 3500), 400);
})();
window.addEventListener('resize', () => { layout(); render(); });
})();
</script>
